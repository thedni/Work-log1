name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          echo "Files in repo:"; find . -maxdepth 3 -type f -not -path './.git/*' | head -50
          FOUND=""
          for f in $(find . -maxdepth 3 -type f -not -path './.git/*' -not -path './.github/*' -printf '%T@ %p\n' | sort -rn | cut -d' ' -f2-); do
            if unzip -tq "$f" > /dev/null 2>&1; then FOUND="$f"; break; fi
          done
          if [ -z "$FOUND" ]; then echo "No zip-like file found in repo"; exit 1; fi
          echo "Using $FOUND"
          cp "$FOUND" worklog-app.zip
          unzip -q worklog-app.zip
          ls worklog-app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: worklog-app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VER=$(grep -oP "versionName '\K[^']+" worklog-app/app/build.gradle)
          cp worklog-app/app/build/outputs/apk/debug/app-debug.apk "TimesWork-v${VER}.apk"
          echo "VER=${VER}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: TimesWork-APK
          path: TimesWork-v*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Times Work v${{ env.VER }}
          files: TimesWork-v*.apk
